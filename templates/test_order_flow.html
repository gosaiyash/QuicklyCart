<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuicklyCart - Test Order Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .card {
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .btn-success {
            background-color: #1cc88a;
            border-color: #1cc88a;
        }
        .btn-warning {
            background-color: #f6c23e;
            border-color: #f6c23e;
        }
        .header {
            background-color: #4e73df;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header text-center">
            <h1>QuicklyCart - Test Order Assignment Flow</h1>
            <p>Use this page to test the order assignment flow between seller and delivery interfaces</p>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3>Seller Interface</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <h4>Order Details</h4>
                            <div class="form-group mb-2">
                                <label for="orderID">Order ID</label>
                                <input type="text" class="form-control" id="orderID" value="ORD-12345" readonly>
                            </div>
                            <div class="form-group mb-2">
                                <label for="customerName">Customer Name</label>
                                <input type="text" class="form-control" id="customerName" value="John Doe">
                            </div>
                            <div class="form-group mb-2">
                                <label for="pickupAddress">Pickup Address</label>
                                <input type="text" class="form-control" id="pickupAddress" value="123 Seller St, Shop #42">
                            </div>
                            <div class="form-group mb-2">
                                <label for="deliveryAddress">Delivery Address</label>
                                <input type="text" class="form-control" id="deliveryAddress" value="456 Customer Ave, Apt 789">
                            </div>
                            <div class="form-group mb-2">
                                <label for="items">Items</label>
                                <textarea class="form-control" id="items" rows="3">1x Burger - $8.99
1x Fries - $3.99
1x Soda - $1.99</textarea>
                            </div>
                            <div class="form-group mb-2">
                                <label for="totalAmount">Total Amount</label>
                                <input type="text" class="form-control" id="totalAmount" value="$14.97">
                            </div>
                            <div class="form-group mb-2">
                                <label for="distance">Distance</label>
                                <input type="text" class="form-control" id="distance" value="3.5 km">
                            </div>
                            <div class="form-group mb-2">
                                <label for="payout">Rider Payout</label>
                                <input type="text" class="form-control" id="payout" value="$5.00">
                            </div>
                        </div>
                        <button id="assignRiderBtn" class="btn btn-primary">Assign to Rider</button>
                        <div id="sellerStatus" class="alert alert-info mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h3>Delivery Interface</h3>
                    </div>
                    <div class="card-body">
                        <div id="noOrdersMessage" class="alert alert-warning">
                            No new orders available. Waiting for assignments...
                        </div>
                        <div id="newOrderCard" class="card" style="display: none;">
                            <div class="card-header bg-warning">
                                <h4>New Order Assigned!</h4>
                            </div>
                            <div class="card-body">
                                <div id="orderDetails"></div>
                                <div class="mt-3">
                                    <button id="acceptOrderBtn" class="btn btn-success me-2">Accept Order</button>
                                    <button id="rejectOrderBtn" class="btn btn-danger me-2">Reject Order</button>
                                    <button id="helpBtn" class="btn btn-warning">Need Help</button>
                                </div>
                            </div>
                        </div>
                        <div id="deliveryStatus" class="alert alert-info mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container for notifications -->
    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Current order data
        let currentOrder = null;

        // Function to show toast notification
        function showToast(message, type = 'info') {
            const toastContainer = document.querySelector('.toast-container');
            const toast = document.createElement('div');
            toast.className = `toast show bg-${type} text-white`;
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');
            
            toast.innerHTML = `
                <div class="toast-header bg-${type} text-white">
                    <strong class="me-auto">QuicklyCart Notification</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    ${message}
                </div>
            `;
            
            toastContainer.appendChild(toast);
            
            // Auto-remove toast after 5 seconds
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // Function to send order to delivery interface
        function sendOrderToRider() {
            // Get order details from form
            const orderData = {
                orderID: document.getElementById('orderID').value,
                customerName: document.getElementById('customerName').value,
                pickupAddress: document.getElementById('pickupAddress').value,
                deliveryAddress: document.getElementById('deliveryAddress').value,
                items: document.getElementById('items').value,
                totalAmount: document.getElementById('totalAmount').value,
                distance: document.getElementById('distance').value,
                payout: document.getElementById('payout').value,
                status: 'assigned',
                timestamp: new Date().toISOString()
            };
            
            // Store order in localStorage
            localStorage.setItem('newDeliveryOrder', JSON.stringify(orderData));
            
            // Trigger storage event manually (since we're in the same page)
            window.dispatchEvent(new Event('storage'));
            
            // Update seller status
            document.getElementById('sellerStatus').textContent = `Order ${orderData.orderID} has been assigned to a rider.`;
            document.getElementById('sellerStatus').style.display = 'block';
            
            // Show toast notification
            showToast('Order has been assigned to a rider!', 'primary');
            
            return orderData;
        }

        // Function to receive order in delivery interface
        function receiveOrder(orderData) {
            currentOrder = orderData;
            
            // Hide no orders message
            document.getElementById('noOrdersMessage').style.display = 'none';
            
            // Show new order card
            document.getElementById('newOrderCard').style.display = 'block';
            
            // Populate order details
            const orderDetailsHTML = `
                <h5>Order ID: ${orderData.orderID}</h5>
                <p><strong>Customer:</strong> ${orderData.customerName}</p>
                <p><strong>Pickup:</strong> ${orderData.pickupAddress}</p>
                <p><strong>Delivery:</strong> ${orderData.deliveryAddress}</p>
                <p><strong>Items:</strong></p>
                <pre>${orderData.items}</pre>
                <p><strong>Total:</strong> ${orderData.totalAmount}</p>
                <p><strong>Distance:</strong> ${orderData.distance}</p>
                <p><strong>Payout:</strong> ${orderData.payout}</p>
            `;
            
            document.getElementById('orderDetails').innerHTML = orderDetailsHTML;
            
            // Show toast notification
            showToast('New order assigned to you!', 'success');
        }

        // Function to accept order
        function acceptOrder() {
            if (!currentOrder) return;
            
            currentOrder.status = 'accepted';
            
            // Update delivery status
            document.getElementById('deliveryStatus').textContent = `Order ${currentOrder.orderID} accepted. Head to pickup location.`;
            document.getElementById('deliveryStatus').style.display = 'block';
            
            // Hide order card
            document.getElementById('newOrderCard').style.display = 'none';
            
            // Show toast notification
            showToast('Order accepted! Head to pickup location.', 'success');
            
            // Update seller status (in real app, this would be via API)
            document.getElementById('sellerStatus').textContent = `Rider has accepted order ${currentOrder.orderID}.`;
        }

        // Function to reject order
        function rejectOrder() {
            if (!currentOrder) return;
            
            currentOrder.status = 'rejected';
            
            // Update delivery status
            document.getElementById('deliveryStatus').textContent = `Order ${currentOrder.orderID} rejected. Waiting for new orders...`;
            document.getElementById('deliveryStatus').style.display = 'block';
            
            // Hide order card
            document.getElementById('newOrderCard').style.display = 'none';
            
            // Show no orders message
            document.getElementById('noOrdersMessage').style.display = 'block';
            
            // Show toast notification
            showToast('Order rejected.', 'danger');
            
            // Update seller status (in real app, this would be via API)
            document.getElementById('sellerStatus').textContent = `Rider has rejected order ${currentOrder.orderID}. Please assign to another rider.`;
            
            currentOrder = null;
        }

        // Function to request help
        function requestHelp() {
            if (!currentOrder) return;
            
            // Show toast notification
            showToast('Support request sent. Someone will contact you shortly.', 'warning');
            
            // Update delivery status
            document.getElementById('deliveryStatus').textContent = `Support request sent for order ${currentOrder.orderID}. Please wait.`;
            document.getElementById('deliveryStatus').style.display = 'block';
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Assign rider button
            document.getElementById('assignRiderBtn').addEventListener('click', function() {
                sendOrderToRider();
            });
            
            // Accept order button
            document.getElementById('acceptOrderBtn').addEventListener('click', function() {
                acceptOrder();
            });
            
            // Reject order button
            document.getElementById('rejectOrderBtn').addEventListener('click', function() {
                rejectOrder();
            });
            
            // Help button
            document.getElementById('helpBtn').addEventListener('click', function() {
                requestHelp();
            });
            
            // Listen for storage events (for cross-tab communication)
            window.addEventListener('storage', function(e) {
                // Check if the storage event is for our order
                if (e.key === 'newDeliveryOrder' || (e.key === null && localStorage.getItem('newDeliveryOrder'))) {
                    const orderData = JSON.parse(localStorage.getItem('newDeliveryOrder'));
                    if (orderData) {
                        receiveOrder(orderData);
                    }
                }
            });
            
            // Check for existing orders in localStorage on page load
            const existingOrder = localStorage.getItem('newDeliveryOrder');
            if (existingOrder) {
                receiveOrder(JSON.parse(existingOrder));
            }
        });
    </script>
</body>
</html>
