<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Address - QuicklyCart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color:#007BFF; --border-color:#e5e7eb; --surface:#fff; --radius:12px; }
        *{box-sizing:border-box;font-family:'Poppins',sans-serif}
        body{background:#f8fafc;margin:0;color:#111827}
        .container{max-width:900px;margin:20px auto;padding:16px}
        .card{background:var(--surface);border:1px solid var(--border-color);border-radius:var(--radius);padding:16px}
        .address{border:1px solid var(--border-color);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px}
        .address input{width:18px;height:18px}
        .actions{margin-top:16px;display:flex;gap:10px}
        .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:8px;border:1px solid var(--primary-color);background:var(--primary-color);color:#fff;font-weight:600;cursor:pointer;text-decoration:none}
        .btn-outline{background:#fff;color:var(--primary-color)}
    </style>
    {% load static %}
</head>
<body>
    <div class="container">
        <h2>Select Delivery Address</h2>
        <div class="card">
            {% if addresses %}
                {% for a in addresses %}
                <label class="address">
                    <input type="radio" name="address" value="{{ a.id }}" {% if forloop.first %}checked{% endif %}>
                    <div>
                        <div style="font-weight:600">{{ a.address }}</div>
                        <div style="color:#6b7280">{{ a.city }} - {{ a.pincode }}</div>
                    </div>
                </label>
                {% endfor %}
            {% else %}
                <p>No saved address found. Please update your address in profile.</p>
            {% endif %}
            <div class="actions">
                <a class="btn" href="/checkout/payment/">Continue to Payment</a>
                <a class="btn btn-outline" href="/">Cancel</a>
            </div>
        </div>
    </div>
</body>
</html>
